name: Bug report
description: Something the script does wrong, or no longer does
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue, please.

        Before you start: check the [latest release](https://github.com/OldRon1977/HHauto/releases) — a good part of what gets reported is already fixed there.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the script did, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there
      placeholder: |
        1. Enable option '...'
        2. Go to the '...' page
        3. Wait for the script to '...'
        4. It then '...'
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Script menu → **Debug Menu** in the footer → **Save Debug**, then drag the file into this field. See [Debugging](https://github.com/OldRon1977/HHauto/wiki/Debugging).

        The log already carries your script version, the game, your browser and all your settings, so nothing of that needs typing. It covers roughly the last 16 hours.

        No log possible? Then write down script version, game and browser here instead.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional. Browser console (F12), anything that mentions HHAuto.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots or anything else
      description: Optional. Drag images into this field.
    validations:
      required: false
