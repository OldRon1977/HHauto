name: Enhancement request
description: An existing function that should work differently
title: "Enhancement: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One enhancement per issue, please. For something the script does not do at all yet, use the feature request instead.

  - type: input
    id: feature
    attributes:
      label: Which function
      description: As it is named in the menu
      placeholder: "Market → Myth. & Leg. Boosters"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What it does today
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: What it should do instead
      description: If it depends on the situation, say which situation
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots or anything else
      description: Optional
    validations:
      required: false
