name: Feature request
description: Something the script does not do yet
title: "Request: "
labels: ["new feature"]
body:
  - type: markdown
    attributes:
      value: |
        One request per issue, please. To change how an existing function behaves, use the enhancement request instead.

  - type: textarea
    id: what
    attributes:
      label: What should the script do
      description: The task you would hand over, and what you do by hand today
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: What would it have to decide
      description: |
        Anything that spends a resource needs a rule: which items may be sold, how many fights may be used, when to stop. Say where your limits would sit — without them a request usually cannot be built safely.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Part of the game
      options:
        - Daily activities (salary, missions, contests, quests)
        - Adventure (troll battles, events, love raids)
        - Season
        - Leagues
        - Champions
        - Labyrinth
        - Market
        - Harem
        - Events
        - Something else
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots or anything else
      description: Optional
    validations:
      required: false
